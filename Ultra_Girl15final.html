'use strict';
/* ===================== TEST SETTING: START LEVEL =====================
   Which level the game starts on (1-10). Level 10 is the boss.
   Change this number to test a later level without playing through the
   earlier ones, e.g. START_LEVEL=10 to fight the boss right away.
   Keep it at 1 for normal play.
   ===================================================================== */
const START_LEVEL=1;

/* ===================== DIFFICULTY OFFSET =====================
   How many levels "ahead" the difficulty runs. With 5, level 1 plays
   like level 6 used to, level 2 like level 7, and so on, still rising
   level by level exactly as before. Set to 0 for the original curve.
   ============================================================== */
const DIFF_OFFSET_LEVELS=5;

/* ===================== FALLING INTO A HOLE =====================
   Falling no longer means instant death. You lose FALL_PENALTY hearts
   and are put back on solid ground to the left of the hole, about
   RESPAWN_BACK tiles before its edge (1 tile = 32 px), blinking
   invulnerable for a moment. If that costs your last heart, it is
   game over as usual.
   =============================================================== */
const FALL_PENALTY=2,RESPAWN_BACK=3;

/* ===================== BOSS MACHINE-GUN FIRE =====================
   Every AUTO_MIN..AUTO_MAX regular fireballs (random each time) the boss
   fires a salvo of 3 straight shots from his mouth, standing or from a
   jump. They fly at AUTO_SPEED px/s (fireballs: 150-210, your shots: 640)
   and are stopped by blocks just like your own shots.
   ================================================================= */
const AUTO_SPEED=260,AUTO_MIN=3,AUTO_MAX=6;

/* ===================== AMBIENT FIREBALLS =====================
   From level AMB_LEVEL until the boss arena, the boss's regular fireball
   also drifts in from the right edge now and then (low, medium or high,
   same look, same sine-wave flight). They cannot be shot. A new one
   comes every AMB_MIN..AMB_MAX seconds, and the speed follows the boss's
   range: 150 px/s on level 7, 180 on level 8, 210 on level 9.
   ============================================================== */
const AMB_LEVEL=7,AMB_MIN=4,AMB_MAX=7;

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=540,T=32,GJ=14,GY=GJ*T,DT=1/120;
const PW=20,PH=44,JV=-700,G=2200,ANCH=280;
let sc=1;
function resize(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;sc=r.width*d/W;cv.width=Math.round(W*sc);cv.height=Math.round(H*sc)}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let state='title',cols,genX,pruneX,cam,time,diff,flatOnly,deadT=0,best=0,jumpHeld=false,bufT=0,coyT=0,tt=0;
let E=[],B=[],S=[],PU=[],dry=0,kills=0,hp=3,inv=0,shootT=0,flyT=2,walkT=8,face=1;
const keys={l:0,r:0,s:0},RUN=260;
let boss=null,FB=[],MB=[],AF=[],ambT=4,CF=[],winT=0,winJ=0,winBonus=0,arenaDone=false,vpose=false;

try{best=+localStorage.getItem('ug_best')||0}catch(e){}

/* ---------- level ---------- */
function mk(i,g,t){cols.set(i,{g,t:new Set(t||[])})}
const tiles=h=>Array.from({length:h},(_,k)=>GJ-1-k);
function flat(n){for(let k=0;k<n;k++)mk(genX++,true)}
function solid(c,j){const k=cols.get(c);if(!k)return j>=GJ;return k.t.has(j)||(j>=GJ&&k.g)}
function hit(x,y,w,h){
  const c0=Math.floor((x-w/2)/T),c1=Math.floor((x+w/2-.01)/T),j0=Math.floor(y/T),j1=Math.floor((y+h-.01)/T);
  for(let c=c0;c<=c1;c++)for(let j=j0;j<=j1;j++)if(solid(c,j))return true;
  return false}
function reset(isFlat){
  const L0=isFlat?1:clamp(START_LEVEL,1,10),st=L0>=10?ARENA_COL-30:(L0-1)*LVLEN;cols=new Map();genX=st;pruneX=st;flatOnly=isFlat;arenaDone=false;boss=null;FB=[];MB=[];AF=[];ambT=rnd(3,6);CF=[];cam=st*T;time=0;diff=0;E=[];B=[];S=[];PU=[];dry=0;kills=0;hp=3;inv=0;shootT=0;flyT=2.5;walkT=10;face=1;curLvl=Math.min(L0,9);thCur=thPrev=(curLvl-1)%4;thMix=1;ban=0;
  flat(16);p.x=cam+ANCH;p.y=GY-PH;p.vy=0;p.ph=0;p.air=false;bufT=0;coyT=0}
function arena(){
  flat(ARENA_COL-genX);flat(36);
  let c=ARENA_COL+4;
  while(c<ARENA_COL+13){let h=ri(1,3);const w=ri(1,3);for(let k=0;k<w;k++,c++){h=clamp(h+ri(-1,1),1,3);cols.get(c).t=new Set(tiles(h))}c+=ri(3,5)}
  arenaDone=true}
function gen(){
  while(pruneX<Math.floor(cam/T)-12)cols.delete(pruneX++);
  while(genX*T<cam+W+500){
    if(flatOnly||arenaDone){flat(8);continue}
    if(genX>=ARENA_COL-40){arena();continue}
    const d=diff;
    const maxH=d<.15?1:d<.45?2:3;
    const maxPit=clamp(Math.floor((.55+.25*d)*RUN*.636/T),2,4);
    const r=Math.random();
    const kind=r<.28?'pit':r<.52?'pillar':r<.74?'stairs':(d>.4&&r<.88)?'stones':'ruins';
    if(kind==='pit'){
      const w=ri(2,maxPit);for(let k=0;k<w;k++)mk(genX++,false);
    }else if(kind==='pillar'){
      const w=ri(1,2),h=ri(1,maxH);for(let k=0;k<w;k++)mk(genX++,true,tiles(h));
    }else if(kind==='stairs'){
      const n=ri(2,maxH+1);
      for(let s=1;s<=n;s++){const w=ri(1,2);for(let k=0;k<w;k++)mk(genX++,true,tiles(s))}
      if(Math.random()<.6)for(let s=n-1;s>=1;s--){const w=ri(1,2);for(let k=0;k<w;k++)mk(genX++,true,tiles(s))}
    }else if(kind==='stones'){
      const n=ri(2,3);
      for(let s=0;s<n;s++){
        const gp=ri(2,Math.max(2,maxPit-1));for(let k=0;k<gp;k++)mk(genX++,false);
        for(let k=0;k<3;k++)mk(genX++,false,[GJ]);
      }
      const gp=ri(2,Math.max(2,maxPit-1));for(let k=0;k<gp;k++)mk(genX++,false);
    }else{
      let h=0;const w=ri(4,8);
      for(let k=0;k<w;k++){h=clamp(h+ri(-2,2),0,maxH);mk(genX++,true,tiles(h))}
    }
    flat(Math.round(lerp(6,3,d))+ri(0,2));
  }
}

/* ---------- music (Web Audio: 2 pulse, triangle, noise) ---------- */
const NN={C:0,D:2,E:4,F:5,G:7,A:9,B:11},mf=m=>440*2**((m-69)/12);
const songs={
  stage:{bpm:150,loop:1,drums:1,duty:.25,chords:[[0, 0], [7, 0], [9, 1], [5, 0], [0, 0], [7, 0], [5, 0], [7, 0], [5, 0], [0, 0], [2, 1], [7, 0], [5, 0], [0, 0], [7, 0], [0, 0]],lead:'E5:2 G5:2 C6:4 B5:2 G5:2 E5:4 D5:2 G5:2 B5:4 A5:2 G5:2 D5:4 C5:2 E5:2 A5:4 G5:2 E5:2 C5:2 E5:2 A5:2 F5:2 C6:4 A5:2 F5:2 A5:4 G5:2 E5:2 C5:2 E5:2 G5:4 C6:4 B5:2 G5:2 D5:2 G5:2 B5:4 D6:4 C6:2 A5:2 F5:2 A5:2 C6:4 A5:2 F5:2 G5:2 A5:2 B5:2 D6:2 G6:6 -:2 A5:3 C6:1 F6:4 E6:2 C6:2 A5:4 G5:3 C6:1 E6:4 D6:2 C6:2 G5:4 F5:2 A5:2 D6:4 C6:2 A5:2 F5:2 A5:2 G5:2 B5:2 D6:2 G6:2 F6:2 D6:2 B5:4 A5:2 C6:2 F6:2 E6:2 D6:2 C6:2 A5:4 G5:2 C6:2 E6:2 G6:2 E6:2 C6:2 G5:4 B5:2 D6:2 G6:4 F6:2 D6:2 B5:2 D6:2 C6:4 B5:2 A5:2 G5:2 E5:2 D5:2 G5:2'},
  title:{bpm:132,loop:1,drums:1,duty:.125,o:{echo:1},chords:[[0, 0], [9, 1], [5, 0], [7, 0], [0, 0], [9, 1], [5, 0], [7, 0]],lead:'G5:4 E5:2 G5:2 C6:8 A5:4 E5:2 A5:2 C6:4 B5:2 A5:2 A5:4 F5:2 A5:2 C6:8 B5:4 D6:4 G6:4 F6:2 D6:2 E6:4 C6:2 E6:2 G6:8 A6:4 E6:2 A6:2 G6:4 E6:4 F6:2 E6:2 D6:2 C6:2 A5:2 C6:2 F6:4 D6:2 B5:2 G5:2 B5:2 D6:8'},
  stage2:{bpm:144,loop:1,drums:1,duty:.5,chords:[[7, 0], [2, 0], [4, 1], [0, 0], [7, 0], [2, 0], [0, 0], [2, 0], [0, 0], [7, 0], [9, 1], [2, 0], [0, 0], [7, 0], [2, 0], [7, 0]],lead:'D6:2 B5:2 G5:2 B5:2 D6:2 G6:2 D6:4 F#6:2 D6:2 A5:2 D6:2 F#6:4 A6:4 E6:2 B5:2 G5:2 B5:2 E6:4 G6:2 E6:2 E6:2 C6:2 G5:2 C6:2 E6:2 D6:2 C6:4 B5:2 D6:2 G6:4 F#6:2 E6:2 D6:4 A5:2 D6:2 F#6:2 A6:2 F#6:2 D6:2 A5:4 C6:2 E6:2 G6:4 E6:2 C6:2 G5:4 D6:2 E6:2 F#6:2 A6:2 F#6:4 D6:4 G6:3 E6:1 C6:4 E6:2 G6:2 E6:4 D6:3 B5:1 G5:4 B5:2 D6:2 G6:4 C6:2 E6:2 A6:4 G6:2 E6:2 C6:2 E6:2 D6:2 F#6:2 A6:2 F#6:2 D6:2 A5:2 D6:4 E6:2 G6:2 E6:2 C6:2 E6:2 G6:2 E6:4 D6:2 G6:2 B6:4 A6:2 G6:2 D6:4 F#6:2 A6:2 D6:2 F#6:2 A6:4 F#6:4 G6:4 F#6:2 E6:2 D6:2 B5:2 A5:2 B5:2'},
  boss:{bpm:172,loop:1,drums:1,duty:.125,o:{ap:2,dr:0,echo:1},chords:[[9,1],[5,0],[0,0],[7,0],[9,1],[5,0],[7,0],[4,0]],lead:'A5:2 C6:2 E6:2 C6:2 A5:4 E5:4 F5:2 A5:2 C6:2 A5:2 F5:4 C6:4 G5:2 C6:2 E6:2 C6:2 G5:4 E6:4 G5:2 B5:2 D6:2 B5:2 G5:4 D6:4 A5:2 C6:2 E6:2 A6:2 G6:2 E6:2 C6:4 F6:2 E6:2 D6:2 C6:2 A5:2 C6:2 F6:4 G5:2 B5:2 D6:2 G6:2 F6:2 D6:2 B5:4 E6:2 D6:2 C6:2 B5:2 E6:4 -:4'},
  win:{bpm:140,loop:0,drums:1,duty:.125,o:{echo:1},chords:[[0,0],[5,0],[7,0],[0,0]],lead:'C6:2 C6:2 C6:2 G5:2 C6:4 E6:4 F6:2 F6:2 F6:2 C6:2 F6:4 A6:4 G6:4 F6:2 E6:2 D6:4 B5:4 C6:2 E6:2 G6:2 E6:2 C7:8'},
  over:{bpm:116,loop:0,drums:0,duty:.125,lead:'G5:2 E5:2 C5:2 A4:2 G4:2 -:2 C4:10'}
},built={};
let AC=null,master,mus,pend=null,noiseBuf,muted=false,song=null,sIdx=0,nextT=0;const waves={};
function nm(t){const m=/^([A-G])(#|b)?(\d)$/.exec(t);return 12*(+m[3]+1)+NN[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)}
function seq(str){const out=[];let t=0;for(const k of str.trim().split(/\s+/)){const[n,l]=k.split(':'),len=+l||1;out.push({t,len,m:n==='-'?null:nm(n)});t+=len}return out}
const APS=[[0,1,2,3,2,1,0,1,2,3,2,1,0,1,2,3],[0,2,1,3,0,2,1,3,0,2,1,3,0,2,1,3],[0,1,2,1,0,1,2,1,3,2,1,2,3,2,1,2]];
function build(d,tr=0,bpm=d.bpm,duty=d.duty,o=d.o||{}){
  const L=seq(d.lead),end=L.reduce((a,e)=>Math.max(a,e.t+e.len),0),total=d.chords?d.chords.length*16:end;
  const st=Array.from({length:total},()=>[]);
  for(const e of L)if(e.m!==null&&e.t<total){st[e.t].push({c:'lead',m:e.m+tr,l:e.len});if(o.echo)st[(e.t+3)%total].push({c:'echo',m:e.m+tr,l:e.len})}
  const ap=APS[o.ap||0],ds=o.dr||0;
  (d.chords||[]).forEach(([p0,mn],b)=>{const pc=(p0+tr+12)%12;
    const t0=b*16,tri=[0,mn?3:4,7,12];
    for(let i=0;i<8;i++)st[t0+i*2].push({c:'bass',m:48+pc+(i%2?12:i===6?7:0),l:2});
    for(let i=0;i<16;i++){
      st[t0+i].push({c:'arp',m:60+pc+tri[ap[i]],l:1});
      if(d.drums){if(ds===1){if(i%4===0)st[t0+i].push({c:'kick'});if(i%8===4)st[t0+i].push({c:'snare'});if(i%2===1)st[t0+i].push({c:'hat',o:0})}else{if(i%8===0||i===10)st[t0+i].push({c:'kick'});if(i%8===4)st[t0+i].push({c:'snare'});if(i%2===0)st[t0+i].push({c:'hat',o:i%4===2})}}}});
  return{steps:st,bpm,loop:d.loop,duty}}
function pulse(d){
  if(!waves[d]){const n=32,re=new Float32Array(n),im=new Float32Array(n);
    for(let k=1;k<n;k++)re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*d);waves[d]=AC.createPeriodicWave(re,im)}
  return waves[d]}
function osc(type,f,t,dur,v,duty,decay){
  const o=AC.createOscillator(),g=AC.createGain();
  if(duty)o.setPeriodicWave(pulse(duty));else o.type=type;
  o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);
  if(decay)g.gain.exponentialRampToValueAtTime(.001,t+dur);else{g.gain.setValueAtTime(v,t+dur*.8);g.gain.linearRampToValueAtTime(0,t+dur)}
  o.connect(g).connect(mus);o.start(t);o.stop(t+dur+.02)}
function noise(t,dur,v,hp){
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(mus);s.start(t);s.stop(t+dur+.02)}
function kick(t){
  const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.1);
  g.gain.setValueAtTime(.5,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);
  o.connect(g).connect(mus);o.start(t);o.stop(t+.16)}
function play(e,t,sd){
  const d=e.l*sd;
  switch(e.c){
    case'lead':osc('',mf(e.m),t,d*.92,.085,song.duty);break;
    case'echo':osc('',mf(e.m),t,d*.8,.03,song.duty,1);break;
    case'arp':osc('',mf(e.m),t,d*.9,.04,.125,1);break;
    case'bass':osc('triangle',mf(e.m),t,d*.9,.2);break;
    case'kick':kick(t);break;
    case'snare':noise(t,.1,.16,1400);break;
    case'hat':noise(t,e.o?.09:.035,.06,7000)}}
function tick(){
  if(!song)return;
  while(song&&nextT<AC.currentTime+.15){
    if(pend&&sIdx%16===0){song=pend;pend=null;sIdx=0}const sd=60/song.bpm/4;
    for(const e of song.steps[sIdx])play(e,nextT,sd);
    nextT+=sd;sIdx++;
    if(sIdx>=song.steps.length){if(song.loop)sIdx=0;else song=null}}}
function music(n){if(!AC)return;pend=null;song=built[n]||(built[n]=build(songs[n]));sIdx=0;nextT=AC.currentTime+.06}
function initAudio(){
  if(AC)return;
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);mus=AC.createGain();mus.gain.value=.4;mus.connect(master);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    AC.resume();setInterval(tick,25)}catch(e){AC=null}}
function go(){if(!AC){initAudio();music('title');return}start()}
addEventListener('pointerup',()=>{if(AC&&AC.state!=='running')AC.resume()});
document.addEventListener('visibilitychange',()=>{if(AC)document.hidden?AC.suspend():AC.resume()});

/* ---------- sound effects ---------- */
function sw(f0,f1,dur,v,duty,lp,t){
  const o=AC.createOscillator(),g=AC.createGain();t=t||AC.currentTime;
  if(duty)o.setPeriodicWave(pulse(duty));else o.type='triangle';
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  let n=o;if(lp){const q=AC.createBiquadFilter();q.type='lowpass';q.frequency.value=lp;o.connect(q);n=q}
  n.connect(g).connect(master);o.start(t);o.stop(t+dur+.02)}
function nz(f0,f1,dur,v,t){
  const s=AC.createBufferSource(),g=AC.createGain(),q=AC.createBiquadFilter();t=t||AC.currentTime;
  s.buffer=noiseBuf;q.type='lowpass';q.frequency.setValueAtTime(f0,t);q.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(q).connect(g).connect(master);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function sfx(n){
  if(!AC)return;const t=AC.currentTime;
  if(n==='heart'){sw(784,790,.1,.07,.25,2400,t);sw(1175,1182,.18,.07,.25,2400,t+.08)}
  else if(n==='level'){[1047,1319,1568,2093].forEach((f,i)=>sw(f,f*.99,.12,.06,.25,2400,t+i*.07))}
  else if(n==='jump')sw(170,420,.17,.09,.5,1100);                                   // dull rising "boop"
  else if(n==='shoot'){nz(2600,300,.09,.16);sw(240,70,.08,.08,.5,900)}          // soft explosive pop
  else if(n==='tick'){nz(1800,500,.05,.12);sw(200,120,.05,.05,.25,1500)}        // enemy hit, not dead
  else if(n==='fire'){nz(1400,300,.28,.14);sw(320,130,.22,.07,.5,900)}
  else if(n==='boom'){nz(3200,150,.32,.3);sw(150,38,.25,.18)}                   // enemy explosion
  else if(n==='hurt'){for(let i=0;i<3;i++)sw(1100,380,.1,.13,.125,0,t+i*.11);nz(5000,800,.2,.1)} // sharp "ouch"
}

/* ---------- input ---------- */
const JK=['Space','ArrowUp','KeyW'],LK=['ArrowLeft','KeyA'],RK=['ArrowRight','KeyD'],FK=['KeyX','KeyJ','KeyZ','ShiftLeft','ShiftRight'];
function start(){reset(false);state='play';jumpHeld=true;bufT=0;stageNow(curLvl)}
function press(){
  if(state==='title'){go();return}
  if(state==='dead'){if(deadT>.6)start();return}
  if(state==='win'){if(winT>1.5){reset(true);state='title';music('title')}return}
  jumpHeld=true;bufT=.12}
function release(){jumpHeld=false}
addEventListener('keydown',e=>{const c=e.code;
  if(JK.includes(c)||LK.includes(c)||RK.includes(c)||FK.includes(c))e.preventDefault();
  if(state==='title'&&(c==='Enter'||FK.includes(c))){go();return}
  if(c==='KeyM'){muted=!muted;if(master)master.gain.value=muted?0:.5}
  if(JK.includes(c)){if(!e.repeat)press()}
  else if(LK.includes(c))keys.l=1;else if(RK.includes(c))keys.r=1;else if(FK.includes(c))keys.s=1});
addEventListener('keyup',e=>{const c=e.code;
  if(JK.includes(c))release();else if(LK.includes(c))keys.l=0;else if(RK.includes(c))keys.r=0;else if(FK.includes(c))keys.s=0});
// touch zones: 0-15% left, 15-30% right, 30-70% jump, 70-100% shoot
const ptr=new Map();
function apply(z,on){if(z==='l')keys.l=on;else if(z==='r')keys.r=on;else if(z==='s')keys.s=on;else{on?press():release()}}
cv.tabIndex=0;cv.style.outline='none';
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{keys.l=keys.r=keys.s=0;jumpHeld=false});
cv.addEventListener('pointerdown',e=>{e.preventDefault();window.focus();cv.focus({preventScroll:true});
